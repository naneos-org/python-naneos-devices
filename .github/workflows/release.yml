name: release
# Releases whatever version pyproject.toml holds, once per version:
#   uv version --bump patch            -> 2.0.3     TestPyPI + PyPI
#   uv version --bump patch --bump rc  -> 2.0.3rc1  TestPyPI only
# The v<version> tag is created here, after publishing; a version whose tag
# already exists is skipped, so ordinary pushes to master release nothing.
on:
  push:
    branches: [master]
  workflow_dispatch:  # retry a failed release without a new commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - id: version
        run: |
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

          # a/b/rc/dev versions stay on TestPyPI; final and .post versions go to PyPI too.
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every push to master (ci.yml itself only triggers on pull requests),
  # so the checks run once whether or not the push is a release.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, ci]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv build --no-sources
      # Install the wheel into a clean environment and check it reports the version we release.
      - name: Smoke test the wheel
        run: |
          reported="$(uv run --isolated --no-project --with dist/*.whl naneos-uploader --version)"
          echo "$reported"
          test "$reported" = "naneos-devices ${{ needs.check.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # trusted publishing, no API token
    steps:
      - uses: actions/checkout@v4  # for the testpypi index in pyproject.toml
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The index doubles as check URL: files that are already uploaded are skipped.
      - run: uv publish --index testpypi --trusted-publishing always

  pypi:
    needs: [check, testpypi]
    if: needs.check.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: uv publish --check-url https://pypi.org/simple/ --trusted-publishing always

  github-release:
    needs: [check, testpypi, pypi]
    # pypi is skipped for pre-releases; a failed pypi job must not get tagged.
    if: ${{ !cancelled() && needs.testpypi.result == 'success' && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            "${flags[@]}"
