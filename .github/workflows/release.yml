name: release
# Releases whatever version pyproject.toml holds, once per version:
#   uv version --bump patch            -> 2.0.3     PyPI
#   uv version --bump patch --bump rc  -> 2.0.3rc1  PyPI, as a pre-release (pip skips it unless asked)
# The v<version> tag is created here, after publishing; a version whose tag
# already exists is skipped, so ordinary pushes to master release nothing.
# PyPI holds the releases, there are no GitHub releases.
on:
  push:
    branches: [master]
  workflow_dispatch:  # retry a failed release without a new commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - id: version
        run: |
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every push to master (ci.yml itself only triggers on pull requests),
  # so the checks run once whether or not the push is a release.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, ci]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
      - run: uv build --no-sources
      # Install the wheel into a clean environment and check it reports the version we release.
      - name: Smoke test the wheel
        run: |
          reported="$(uv run --isolated --no-project --with dist/*.whl naneos-uploader --version)"
          echo "$reported"
          test "$reported" = "naneos-devices ${{ needs.check.outputs.version }}"
          # The gui extra must resolve, and naneos-gui must start (--version does not need Qt).
          wheel="$(realpath dist/*.whl)"
          reported="$(uv run --isolated --no-project --with "naneos-devices[gui] @ file://$wheel" naneos-gui --version)"
          echo "$reported"
          test "$reported" = "naneos-gui ${{ needs.check.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # No checkout here, the job only uploads the built files: nothing to cache,
      # and the empty working directory is intended.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
          ignore-empty-workdir: true
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: uv publish --check-url https://pypi.org/simple/ --trusted-publishing always

  # The tag marks the released commit and is what the check job looks for.
  tag:
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" --silent
