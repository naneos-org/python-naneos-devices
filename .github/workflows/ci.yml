name: ci
on:
  pull_request:
  workflow_call:  # pushes to master run these checks through release.yml, once

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"  # the minimum we support; mypy checks that syntax level
          # Same cache key as the 3.11 test job running in parallel; let that one save it.
          save-cache: false
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      # Hardware tests (marker "hardware") are excluded by the pytest config.
      - run: uv run pytest
