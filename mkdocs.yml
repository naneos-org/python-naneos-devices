site_name: naneos-devices

theme:
  name: "material"
  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
  - api-autonav:
      modules: ['src/naneos']

nav:
  - Home: index.md
  - User Guide:
      - Devices and commands: user-guide/devices.md
      - Desktop App (Tray Icon): user-guide/desktop-app.md
      - Raspberry Pi Setup: user-guide/raspberry-pi-setup.md
      - Logging: user-guide/logging.md
      - Migrating from 1.x to 2.0: user-guide/migration-2.0.md
  - Development:
      - Development: development/contributing.md
