[project]
name = "naneos-devices"
version = "2.0.4rc1"
description = "naneos particle solutions gmbh python backend"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Mario Huegi", email = "mario.huegi@naneos.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "bleak>=3.0.2",
    "numpy>=2.2.6",
    "pandas>=3.0.5",
    "protobuf>=7.36.1",
    "pyserial>=3.5",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# naneos.cloud.download: read your data back from the naneos IoT service.
download = ["influxdb-client[ciso]>=1.50.0"]

[project.scripts]
naneos-uploader = "naneos.cli:main"

[project.urls]
Repository = "https://github.com/naneos-org/python-naneos-devices"
Documentation = "https://naneos-org.github.io/python-naneos-devices/"

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "influxdb-client[ciso]>=1.50.0",
    "matplotlib>=3.11.2",
    "mkdocs-api-autonav>=0.2.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.3.1",
    "nox>=2026.8.17",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.7",
    "types-protobuf>=7.35.1.20260906",
    "types-pyserial>=3.5.0.20260712",
    "types-requests>=2.33.0.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/naneos"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Hardware tests need a Partector on USB or BLE and take 10-30 s each.
# Run them with: uv run pytest -m hardware
markers = [
    "hardware: needs a Partector connected via USB or BLE",
    "network: needs internet access and naneos IoT credentials",
]
addopts = "-m 'not hardware and not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/naneos/protobuf/proto_v2_pb2.py", "src/naneos/protobuf/proto_v2_pb2.pyi"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
# No python_version: mypy follows the interpreter it runs under, so the
# dependency stubs it sees match that interpreter (numpy 2.5 stubs use the
# 3.12 `type` statement, numpy 2.4 on 3.11 does not).
files = ["src"]
exclude = ["proto_v2_pb2\\.pyi?$"]

[[tool.mypy.overrides]]
# Generated by protoc; its stub declares the module level extensions in a way mypy rejects.
module = "naneos.protobuf.proto_v2_pb2"
ignore_errors = true
